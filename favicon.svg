<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4837"/>
      <stop offset="100%" stop-color="#0e271d"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f28e72"/>
      <stop offset="100%" stop-color="#d96b43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#vetGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <!-- 4 Paw Toe Beans -->
    <ellipse cx="17" cy="20" rx="3.5" ry="4.5" transform="rotate(-24 17 20)" fill="url(#coralGrad)"/>
    <ellipse cx="27" cy="13" rx="3.8" ry="5.2" transform="rotate(-8 27 13)" fill="url(#coralGrad)"/>
    <ellipse cx="37" cy="13" rx="3.8" ry="5.2" transform="rotate(8 37 13)" fill="url(#coralGrad)"/>
    <ellipse cx="47" cy="20" rx="3.5" ry="4.5" transform="rotate(24 47 20)" fill="url(#coralGrad)"/>

    <!-- Heart Main Pad -->
    <path d="M32 49 C23 41 16 34 16 26 C16 20.5 20.5 17 25.5 17 C28.5 17 31 18.5 32 20.5 C33 18.5 35.5 17 38.5 17 C43.5 17 48 20.5 48 26 C48 34 41 41 32 49 Z" fill="url(#coralGrad)"/>

    <!-- Medical Healthcare Cross Inside Heart -->
    <rect x="30" y="25" width="4" height="13" rx="1.5" fill="#ffffff"/>
    <rect x="25.5" y="29.5" width="13" height="4" rx="1.5" fill="#ffffff"/>
  </g>
</svg>
