<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — VetCare Pro</title>
  <meta name="description" content="Sign in to your VetCare Pro Pet Parent Portal to access immunization records, medical history, lab results, and appointments.">
  <link rel="canonical" href="login.html">
  <!-- Favicon and Brand Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Top Right Utility Controls: Dark Mode & RTL -->
  <aside class="auth-top-controls" aria-label="Page View Controls">
    <!-- Theme Toggle -->
    <button class="nav-icon-btn theme-toggle-btn" type="button" aria-label="Toggle light or dark theme" title="Toggle theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>

    <!-- RTL / LTR Text Toggle -->
    <button class="rtl-text-toggle" type="button" aria-label="Toggle language direction" title="Toggle RTL">RTL</button>
  </aside>

  <!-- Centered Minimalist Auth Page Container -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      
      <!-- Company Logo & Name at the Top of the Form -->
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand d-inline-flex align-items-center gap-2 text-decoration-none">
          <div class="brand-icon"><img src="assets/images/favicon.svg" alt="VetCare Pro Logo" class="brand-logo-img"></div>
          <span>VetCare<span class="text-accent">Pro</span></span>
        </a>
        <h1 class="h4 fw-bold text-main mt-3 mb-1">Sign In to Your Account</h1>
        <p class="text-muted small mb-0">Pet Parent & Healthcare Portal</p>
      </div>

      <!-- Google and Apple Login Options -->
      <div class="d-flex flex-column gap-2 mb-3">
        <button type="button" class="btn-social-auth" id="btnGoogleLogin" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <button type="button" class="btn-social-auth" id="btnAppleLogin" aria-label="Sign in with Apple">
          <i class="bi bi-apple fs-5" aria-hidden="true"></i>
          <span>Continue with Apple</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="auth-divider">
        <hr>
        <span>or sign in with email</span>
      </div>

      <!-- Login Form -->
      <form class="needs-validation" data-form-type="login" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
            <div class="invalid-feedback">Please enter a valid registered email.</div>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label small fw-semibold mb-0">Password <span class="text-danger">*</span></label>
            <a href="forgot-password.html" class="small text-accent text-decoration-none">Forgot password?</a>
          </div>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary toggle-password-btn" type="button" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback" id="login-password-feedback">Please enter your password.</div>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-muted" for="rememberMe">Remember this browser</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal</button>

        <div class="text-center pt-3 border-top">
          <span class="small text-muted">New to VetCare Pro?</span>
          <a href="register.html" class="small text-accent fw-bold ms-1 text-decoration-none">Create an Account</a>
        </div>
      </form>
    </div>

    <!-- Back to Home Link -->
    <div class="text-center mt-4">
      <a href="index.html" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Back to Hospital Home
      </a>
    </div>
  </main>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Modular Vanilla JavaScript -->
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>
</body>
</html>
